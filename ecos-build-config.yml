type: ecos-ui
properties:
  buildImage: ecos-nodejs-build:1.1
  image:
    configVersion: v11
  builds:
    - enterprise: true
      plugins:
        - heatmap:1.13.0-snapshot
        - charts-widget:1.7.0-snapshot
        - stages-widget:1.7.0-snapshot
        - kanban-widget:1.10.0-snapshot
        - activities-widget:1.6.0-snapshot
        - gantt-chart-widget:1.2.0-snapshot
    - enterprise: false
      plugins:
        - stages-widget:1.7.0-snapshot
        - kanban-widget:1.10.0-snapshot
        - gantt-chart-widget:1.2.0-snapshot
